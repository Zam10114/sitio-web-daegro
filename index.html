<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximamente</title>
    <style>
        /* Elimina los márgenes del navegador y oculta barras de scroll */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* Fondo negro por si la imagen tarda en cargar */
        }

        /* Contenedor que centra la imagen */
        .contenedor-imagen {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Estilos para que la imagen cubra toda la pantalla sin deformarse */
        .imagen-pantalla {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cambia a 'contain' si no quieres que se corte nada de la imagen */
            object-position: center;
        }
    </style>
</head>
<body>

    <div class="contenedor-imagen">
    <!-- Ruta corregida apuntando a tu carpeta de imágenes -->
    <img src="imagenes/proximamente.png" alt="Sitio en construcción" class="imagen-pantalla">
</div>

</body>
</html>
