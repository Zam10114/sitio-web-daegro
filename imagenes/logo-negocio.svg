<svg xmlns="http://w3.org" viewBox="0 0 160 50" width="160" height="50">
    <!-- Contenedor del Isotipo (Hexágono Morado DAEGRO) -->
    <g transform="translate(5, 2)">
        <!-- Hexágono de Fondo -->
        <polygon points="23,5 41,15 41,35 23,45 5,35 5,15" fill="#7B2CBF" stroke="#ffffff" stroke-width="1.5"/>
        <!-- Silueta Interna Estilizada en Blanco -->
        <path d="M18,15 L28,21 L28,29 L18,35 L13,25 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M20,20 L25,25 L20,30" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Texto de la Empresa (DAEGRO) en Blanco para resaltar sobre el fondo verde -->
    <text x="55" y="33" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" letter-spacing="1">DAEGRO</text>
</svg>

